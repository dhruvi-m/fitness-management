{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>Register New Client</h1>

    <p>
        This phone number is not registered.
    </p>

    <form method="POST" action="{{ url_for('register_client') }}">

        <label>Phone Number</label>

        <input
            type="text"
            name="phone"
            value="{{ phone }}"
            required
        >

        <label>Full Name</label>

        <input
            type="text"
            name="full_name"
            placeholder="Enter full name"
            required
        >

        <label>Gender</label>

        <select name="gender">

            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

        </select>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
        >

        <label>Height (cm)</label>

        <input
            type="number"
            step="0.1"
            name="height_cm"
            placeholder="Example: 170"
        >

        <label>Starting Weight (kg)</label>

        <input
            type="number"
            step="0.1"
            name="starting_weight_kg"
            placeholder="Example: 70"
        >

        <label>Goal</label>

        <textarea
            name="goal"
            placeholder="Example: Weight loss, muscle gain..."
        ></textarea>

        <label>Medical / Other Notes</label>

        <textarea
            name="medical_notes"
            placeholder="Enter relevant notes"
        ></textarea>

        <button type="submit">
            Register Client
        </button>

    </form>

</div>

{% endblock %}
