<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Client</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f5f3ff,
            #ecfeff
        );

    color: #1f2937;
}

.container {

    width: 92%;

    max-width: 800px;

    margin: 40px auto;
}

.back {

    display: inline-block;

    margin-bottom: 20px;

    color: #4f46e5;

    text-decoration: none;

    font-weight: bold;
}

.card {

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}

input,
select,
textarea {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    margin-bottom: 18px;

    border: 1px solid #d1d5db;

    border-radius: 9px;

    font-size: 15px;
}

textarea {

    min-height: 110px;
}

label {

    font-weight: bold;
}

button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

</style>

</head>

<body>


<div class="container">


<a
    href="{{ url_for(
        'client_profile',
        client_id=client.client_id
    ) }}"
    class="back"
>
    ← Back to Client
</a>


<div class="card">

<h1>
    ✏ Edit Client
</h1>


<form method="POST">


<label>
    Full Name
</label>

<input
    type="text"
    name="full_name"
    value="{{ client.full_name }}"
    required
>


<label>
    Phone Number
</label>

<input
    type="text"
    name="phone"
    value="{{ client.phone }}"
    required
>


<label>
    Gender
</label>

<select name="gender">

    <option value="">
        Select Gender
    </option>

    <option
        value="Male"
        {% if client.gender == "Male" %}
        selected
        {% endif %}
    >
        Male
    </option>

    <option
        value="Female"
        {% if client.gender == "Female" %}
        selected
        {% endif %}
    >
        Female
    </option>

    <option
        value="Other"
        {% if client.gender == "Other" %}
        selected
        {% endif %}
    >
        Other
    </option>

</select>


<label>
    Email
</label>

<input
    type="email"
    name="email"
    value="{{ client.email or '' }}"
>


<label>
    Height (cm)
</label>

<input
    type="number"
    step="0.1"
    name="height_cm"
    value="{{ client.height_cm or '' }}"
>


<label>
    Goal
</label>

<textarea
    name="goal"
>{{ client.goal or '' }}</textarea>


<label>
    Medical / Other Notes
</label>

<textarea
    name="medical_notes"
>{{ client.medical_notes or '' }}</textarea>


<button type="submit">
    💾 Save Client Changes
</button>


</form>

</div>


</div>


</body>

</html>
