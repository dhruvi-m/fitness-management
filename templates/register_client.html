<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register New Client
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff,
                    #ecfeff
                );

            color: #1f2937;

        }


        .navbar {

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            padding: 20px 40px;

            font-size: 20px;

            font-weight: bold;

        }


        .container {

            width: 92%;

            max-width: 900px;

            margin: 40px auto;

        }


        .card {

            background: white;

            padding: 35px;

            border-radius: 22px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);

        }


        h1 {

            margin-top: 0;

            color: #4f46e5;

            font-size: 32px;

        }


        .subtitle {

            color: #6b7280;

            margin-bottom: 30px;

        }


        .phone-box {

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff
                );

            padding: 18px;

            border-radius: 12px;

            margin-bottom: 25px;

            border-left:
                5px solid #4f46e5;

        }


        .phone-number {

            font-size: 22px;

            font-weight: bold;

            color: #4f46e5;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 6px;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            margin-bottom: 18px;

            border:
                1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.12);

        }


        textarea {

            min-height: 110px;

            resize: vertical;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

        }


        .button-row {

            display: flex;

            gap: 12px;

            margin-top: 10px;

            flex-wrap: wrap;

        }


        button {

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            border: none;

            padding: 14px 22px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            opacity: 0.92;

        }


        .back-button {

            display: inline-block;

            padding: 14px 22px;

            background: #e5e7eb;

            color: #374151;

            border-radius: 9px;

            text-decoration: none;

            font-weight: bold;

        }


        .required {

            color: #ef4444;

        }


        @media(max-width: 700px) {

            .grid {

                grid-template-columns: 1fr;

            }

            .container {

                width: 95%;

            }

            .card {

                padding: 22px;

            }

        }

    </style>

</head>


<body>


<div class="navbar">

    💪 Fitness Management System

</div>


<div class="container">


<div class="card">


<h1>
    Register New Client
</h1>


<p class="subtitle">

    This phone number is not registered.
    Please enter the client's information.

</p>


<!-- PHONE DISPLAY -->

<div class="phone-box">

    <div>
        Phone Number
    </div>

    <div class="phone-number">

        {{ phone }}

    </div>

</div>


<form
    method="POST"
    action="{{ url_for('register_client') }}"
>


<!-- PHONE -->

<label>

    Phone Number
    <span class="required">*</span>

</label>


<input

    type="text"

    name="phone"

    value="{{ phone }}"

    required

>



<!-- NAME -->

<label>

    Full Name
    <span class="required">*</span>

</label>


<input

    type="text"

    name="full_name"

    placeholder="Enter full name"

    required

>



<!-- TWO COLUMNS -->

<div class="grid">


<div>

<label>
    Gender
</label>


<select name="gender">

    <option value="">
        Select Gender
    </option>

    <option value="Male">
        Male
    </option>

    <option value="Female">
        Female
    </option>

    <option value="Other">
        Other
    </option>

</select>

</div>



<div>

<label>
    Email
</label>


<input

    type="email"

    name="email"

    placeholder="example@gmail.com"

>

</div>



<div>

<label>
    Height (cm)
</label>


<input

    type="number"

    step="0.1"

    name="height_cm"

    placeholder="Example: 170"

>

</div>



<div>

<label>
    Starting Weight (kg)
</label>


<input

    type="number"

    step="0.1"

    name="starting_weight_kg"

    placeholder="Example: 70"

>

</div>


</div>



<!-- GOAL -->

<label>

    Fitness Goal

</label>


<textarea

    name="goal"

    placeholder="Example: Weight loss, muscle gain, improve fitness..."

></textarea>



<!-- MEDICAL NOTES -->

<label>

    Medical / Other Notes

</label>


<textarea

    name="medical_notes"

    placeholder="Enter any relevant notes..."

></textarea>



<!-- BUTTONS -->

<div class="button-row">


<button
    type="submit"
>
    ✅ Register Client
</button>


<a
    href="{{ url_for('home') }}"
    class="back-button"
>
    ← Back
</a>


</div>


</form>


</div>


</div>


</body>

</html>
